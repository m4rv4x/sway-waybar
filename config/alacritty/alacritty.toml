[window]
opacity = 0.85
dynamic_title = false
dimensions = { columns = 115, lines = 25 }

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 15

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[cursor]
style = { shape = "Beam", blinking = "Always" }
blink_interval = 400
unfocused_hollow = true
thickness = 0.25

[colors.cursor]
text = "#24273a"
cursor = "#6c7086"

[bell]
animation = "EaseOutSine"
duration = 100
