######################################
# keybindings for different actions: #
######################################
# Mod is Win Key
set $mod Mod4
floating_modifier $mod

# Basic actions
bindsym $mod+Return exec alacritty
bindsym $mod+q exec swaynag -t warning -m 'Do you really want to close this window?' -B 'Yes, close window' 'kill'
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

# Moving around
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

# Workspaces
bindsym $mod+Tab workspace next
bindsym $mod+Shift+Tab workspace prev
bindsym $mod+ampersand workspace $ws1
bindsym $mod+eacute workspace $ws2
bindsym $mod+quotedbl workspace $ws3
bindsym $mod+apostrophe workspace $ws4
bindsym $mod+parenleft workspace $ws5
bindsym $mod+minus workspace $ws6
bindsym $mod+egrave workspace $ws7
bindsym $mod+underscore workspace $ws8
bindsym $mod+ccedilla workspace $ws9
bindsym $mod+agrave workspace $ws10

# Move containers
bindsym $mod+Shift+ampersand move container to workspace $ws1; notify-send "Moved to workspace 1"
bindsym $mod+Shift+eacute move container to workspace $ws2; notify-send "Moved to workspace 2"
bindsym $mod+Shift+quotedbl move container to workspace $ws3; notify-send "Moved to workspace 3"
bindsym $mod+Shift+apostrophe move container to workspace $ws4; notify-send "Moved to workspace 4"
bindsym $mod+Shift+parenleft move container to workspace $ws5; notify-send "Moved to workspace 5"
bindsym $mod+Shift+minus move container to workspace $ws6; notify-send "Moved to workspace 6"
bindsym $mod+Shift+egrave move container to workspace $ws7; notify-send "Moved to workspace 7"
bindsym $mod+Shift+underscore move container to workspace $ws8; notify-send "Moved to workspace 8"
bindsym $mod+Shift+ccedilla move container to workspace $ws9; notify-send "Moved to workspace 9"
bindsym $mod+Shift+agrave move container to workspace $ws10; notify-send "Moved to workspace 10"

# Layout management
bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+s layout stacking
bindsym $mod+t layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+f fullscreen
bindsym $mod+space floating toggle
bindsym $mod+a focus parent

# Resize mode
mode "resize" {
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"; notify-send "Resize Mode" "Entering resize mode"

# System controls
bindsym $mod+Shift+r restart
# Not working
bindsym $mod+Shift+F1 exec ~/.config/i3/scripts/keyhint-2

# Display and audio controls
bindsym XF86MonBrightnessUp exec ~/.config/sway/scripts/volume_brightness.sh brightness_up
bindsym XF86MonBrightnessDown exec ~/.config/sway/scripts/volume_brightness.sh brightness_down
bindsym XF86AudioRaiseVolume exec ~/.config/sway/scripts/volume_brightness.sh volume_up
bindsym XF86AudioLowerVolume exec ~/.config/sway/scripts/volume_brightness.sh volume_down
# Same but without notification
bindsym $mod+XF86AudioRaiseVolume exec amixer -D pulse sset Master 1%+
bindsym $mod+XF86AudioLowerVolume exec amixer -D pulse sset Master 1%-
# Need this for hardware keyboard
bindsym XF86AudioMute exec ~/.config/sway/scripts/volume_brightness.sh volume_mute
bindsym XF86AudioMicMute exec amixer sset Capture toggle

# Need fix ?
bindsym $mod+p exec /usr/local/bin/switch-audio-port

# Application shortcuts
bindsym $mod+w exec /usr/bin/firefox
bindsym $mod+n exec /usr/bin/thunar

# Full SCreenshot
bindsym Print exec grim ~/%Y-%m-%d-%T-screenshot.png && notify-send "Screenshot saved to ~/$(date +"%Y-%m-%d-%T")-screenshot.png"
# Region Screenshot
bindsym $mod+Print exec grim -g "$(slurp)" ~/%Y-%m-%d-%T-screenshot.png && notify-send "Screenshot saved to ~/$(date +"%Y-%m-%d-%T")-screenshot.png"
# Power profile
bindsym $mod+Shift+p exec ~/.config/sway/scripts/power-profiles

# Rofi menu
#bindsym $mod+d exec rofi -modi drun -show drun -config ~/.config/rofi/rofidmenu.rasi

# Wofi menu
bindsym $mod+d exec wofi --show drun --config ~/.config/rofi/rofidmenu.rasi --show-icons --insensitive

# Launch foot as a dropdown terminal
bindsym twosuperior exec /usr/bin/guake-toggle
# Toggle dropdown terminal
set $dropdown_term foot --app-id dropdown

bindsym $mod+twosuperior exec "swaymsg [app_id=\"dropdown\"] scratchpad show; \
  or exec foot --app-id dropdown --title dropdown --window-size-chars 120x30; \
  move to scratchpad; scratchpad show"